name: Qdrant readiness monitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qdrant-readiness-monitor
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Read collection and one point
        id: probe
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'airline_kb' }}
        run: uv run --no-project --python 3.12 --with qdrant-client==1.18.0 --with python-dotenv==1.2.2 python scripts/check_qdrant.py
      - name: Report failed readiness
        if: failure()
        run: |
          echo '::error::Qdrant readiness failed. Check cluster suspension, credentials and collection state. See docs/MONITORING.md.'
          echo 'Qdrant readiness failed. Check the cluster dashboard and follow docs/MONITORING.md.' >> "$GITHUB_STEP_SUMMARY"
